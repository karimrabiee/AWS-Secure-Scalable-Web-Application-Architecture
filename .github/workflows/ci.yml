name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tests:
    name: Application tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run application and source-contract tests
        run: python -m pytest -q

  terraform-validation:
    name: Terraform validation (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/bootstrap
          - terraform/environments/dev
          - terraform/environments/prod
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize without configuring remote state
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate -no-color

  terraform-security-scan:
    name: Terraform security scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install checkov==3.2.432
      - name: Scan Terraform configuration
        # Keep the initial scan advisory until existing findings are triaged;
        # the report must not silently equate scanner output with a confirmed vulnerability.
        run: checkov --directory terraform --framework terraform --soft-fail
