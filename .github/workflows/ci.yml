name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (lint, tests, audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            terraform/modules/compute/app-src/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application
        run: python -m py_compile terraform/modules/compute/app-src/app.py terraform/modules/compute/app-src/db.py
      - name: Ruff
        run: ruff check .
      - name: Tests with coverage
        run: pytest -q --cov=terraform/modules/compute/app-src --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r terraform/modules/compute/app-src/requirements.txt

  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: appdb
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        # cryptography is needed only because this throw-away server is reached without TLS;
        # production connections use verified TLS and do not need it.
        run: python -m pip install -r requirements-dev.txt cryptography==44.0.0
      - name: Run integration tests against real MySQL
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PASSWORD: ci-only-password
        run: pytest -q tests/test_integration_mysql.py -rs

  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [terraform/bootstrap, terraform/environments/dev, terraform/environments/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Init without backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan for secrets, state files and conflict markers
        run: python scripts/check-repository-hygiene.py
      - name: Shell syntax
        run: bash -n scripts/preflight.sh && bash -n scripts/smoke-test.sh
