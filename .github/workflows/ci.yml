name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token; no AWS credentials are used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = runtime installed on the EC2 instances (Amazon Linux 2023 python3.11); 3.12 = current.
        python-version: ["3.11", "3.12"]
    services:
      # Real MySQL 8.4 (same major version as RDS) for the integration tests.
      # Throw-away CI service: the credential below protects no real data.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-throwaway
          MYSQL_DATABASE: appdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-throwaway"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-only-throwaway
      TEST_DB_NAME: appdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            terraform/modules/compute/app-src/requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application
        run: python -m compileall -q terraform/modules/compute/app-src
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (unit + MySQL integration + infrastructure contracts)
        run: python -m pytest -q --cov=terraform/modules/compute/app-src --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit -r terraform/modules/compute/app-src/requirements.txt

  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [terraform/bootstrap, terraform/environments/dev, terraform/environments/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Formatting
        run: terraform fmt -check -recursive -diff terraform
      - name: Init (no backend, no AWS access)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color

  security-scan:
    name: Security scan (Checkov, advisory)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Checkov
        run: python -m pip install checkov==3.2.432
      - name: Scan Terraform
        # Advisory until findings are triaged (see docs/SECURITY-CONTROL.md); a
        # scanner hit is a lead to investigate, not proof of a vulnerability.
        run: checkov --directory terraform --framework terraform --soft-fail --compact --quiet

  repository:
    name: Repository hygiene and workflow lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret / artifact hygiene
        run: python scripts/check-repository-hygiene.py
      - name: Lint GitHub Actions workflows
        run: |
          python -m pip install actionlint-py==1.7.12.25
          actionlint
