name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            terraform/modules/compute/app-src/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r terraform/modules/compute/app-src/requirements.txt -r requirements-dev.txt
      - name: Compile application
        run: python -m py_compile terraform/modules/compute/app-src/app.py
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r terraform/modules/compute/app-src/requirements.txt

  terraform:
    name: Terraform validation
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        root: [terraform/bootstrap, terraform/environments/dev, terraform/environments/prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Formatting
        run: terraform fmt -check -recursive terraform
      - name: Init without backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: ${{ matrix.root }}
        run: terraform validate -no-color

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for common committed secrets and artifacts
        run: python scripts/check-repository-hygiene.py
