name: Terraform deploy (manual)

# Manual, reviewed deployments only: plan -> (approval) -> apply -> smoke test.
# Authentication uses GitHub OIDC (no long-lived AWS keys are stored anywhere).
#
# STATE KEY - IMPORTANT
# The state object is always  ecomm-platform/<environment>/terraform.tfstate  in the
# bucket given by the TF_STATE_BUCKET variable. This is the same key used by
# environments/<env>/backend.hcl.example, so a laptop and CI always operate on the
# SAME state. (A different key makes Terraform believe nothing exists and try to
# re-create every resource: EntityAlreadyExists / VpcLimitExceeded errors.)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        type: choice
        options: [dev, prod]
      apply:
        description: Apply the reviewed plan (needs environment approval)
        required: true
        type: boolean
        default: false
      allow_fresh_state:
        description: "First deployment only: allow planning against an EMPTY state"
        required: true
        type: boolean
        default: false
      allow_destroy:
        description: Allow a plan that deletes or replaces resources
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  STATE_KEY: ecomm-platform/${{ inputs.environment }}/terraform.tfstate
  TF_DIR: terraform/environments/${{ inputs.environment }}

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_DB_INSTANCE_CLASS: ${{ vars.TF_DB_INSTANCE_CLASS }}
      DEPLOY_ALARM_EMAIL: ${{ vars.TF_ALARM_EMAIL }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION_NAME: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_NAME }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          # The 12-digit account id is masked so it does not appear in public logs.
          aws sts get-caller-identity --query Arn --output text | sed -E 's/[0-9]{12}/************/g'

      - name: Require backend configuration
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "::error::Repository/Environment variable TF_STATE_BUCKET is not set"; exit 1; }
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || { echo "::error::Environment variable AWS_DEPLOY_ROLE_ARN is not set"; exit 1; }

      - name: Diagnose existing state object access
        working-directory: ${{ env.TF_DIR }}
        shell: bash
        run: |
          # A missing object is allowed only for the explicit first-deployment flow.
          # AccessDenied/403 is not treated as an empty state: it must be fixed in IAM/S3.
          set +e
          OUTPUT=$(aws s3api head-object \
            --bucket "$TF_STATE_BUCKET" \
            --key "$STATE_KEY" \
            --region "$AWS_REGION_NAME" 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "State object is readable: s3://$TF_STATE_BUCKET/$STATE_KEY"
          elif echo "$OUTPUT" | grep -Eqi 'AccessDenied|Forbidden|403'; then
            echo "::error::AWS identity cannot read s3://$TF_STATE_BUCKET/$STATE_KEY. Check s3:GetObject on the exact state object, bucket policy, permissions boundary, and KMS key policy if customer-managed encryption is used. See docs/iam/README.md."
            echo "$OUTPUT"
            exit 1
          elif echo "$OUTPUT" | grep -Eqi 'NotFound|404|NoSuchKey'; then
            echo "State object does not exist yet; the explicit empty-state guard below will decide whether this is allowed."
          else
            echo "::error::Could not verify Terraform state access. Review the AWS CLI output below."
            echo "$OUTPUT"
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION_NAME}"

      - name: Guard - state must not be empty
        working-directory: ${{ env.TF_DIR }}
        env:
          ALLOW_FRESH_STATE: ${{ inputs.allow_fresh_state }}
        run: |
          COUNT=$(terraform state list | wc -l)
          echo "Resources tracked in state ${STATE_KEY}: ${COUNT}"
          if [ "$COUNT" -eq 0 ] && [ "$ALLOW_FRESH_STATE" != "true" ]; then
            echo "::error::The state is EMPTY. Applying now would try to re-create resources that may already exist (EntityAlreadyExists / VpcLimitExceeded)."
            echo "::error::Check that '${STATE_KEY}' is the state used for the existing infrastructure (see docs/CI-CD.md, 'Recovering from a wrong state key'). For a genuinely first deployment re-run with allow_fresh_state=true."
            exit 1
          fi

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          if [ "${{ inputs.environment }}" = "prod" ]; then
            test -n "$DEPLOY_DB_INSTANCE_CLASS" || { echo "::error::TF_DB_INSTANCE_CLASS is required for prod"; exit 1; }
            export TF_VAR_db_instance_class="$DEPLOY_DB_INSTANCE_CLASS"
          fi
          if [ -n "$DEPLOY_ALARM_EMAIL" ]; then
            export TF_VAR_alarm_email="$DEPLOY_ALARM_EMAIL"
          fi
          terraform plan -input=false -lock-timeout=300s -out=tfplan

      - name: Summarise plan and apply safety checks
        working-directory: ${{ env.TF_DIR }}
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          # The JSON is only used for counting; it is never uploaded or printed.
          terraform show -json tfplan > "${RUNNER_TEMP}/plan.json"
          ADD=$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "${RUNNER_TEMP}/plan.json")
          CHANGE=$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "${RUNNER_TEMP}/plan.json")
          DESTROY=$(jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length' "${RUNNER_TEMP}/plan.json")
          {
            echo "### Terraform plan - ${{ inputs.environment }}"
            echo ""
            echo "| Add | Change | Destroy / replace |"
            echo "|---|---|---|"
            echo "| ${ADD} | ${CHANGE} | ${DESTROY} |"
            if [ "$DESTROY" -gt 0 ]; then
              echo ""
              echo "Resources to be deleted or replaced:"
              jq -r '.resource_changes[] | select(.change.actions | index("delete")) | "- `" + .address + "` (" + (.change.actions | join("+")) + ")"' "${RUNNER_TEMP}/plan.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DESTROY" -gt 0 ] && [ "$ALLOW_DESTROY" != "true" ]; then
            echo "::error::The plan deletes or replaces ${DESTROY} resource(s). Review the summary; re-run with allow_destroy=true only if this is intended."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5
          if-no-files-found: error

  apply:
    name: Apply (${{ inputs.environment }})
    if: ${{ inputs.apply }}
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION_NAME: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION_NAME }}
          audience: sts.amazonaws.com

      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION_NAME}"

      - name: Apply the reviewed plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -lock-timeout=300s tfplan

      - name: Smoke test through the load balancer
        working-directory: ${{ env.TF_DIR }}
        run: |
          # An apply can finish before new instances have bootstrapped, so poll
          # (bounded: 30 x 20 s = 10 min) until BOTH probes succeed:
          #   /health -> web + app tier through WAF/ALB/Nginx/Gunicorn
          #   /ready  -> database tier (RDS + Secrets Manager + TLS)
          ALB=$(terraform output -raw alb_dns_name)
          for i in $(seq 1 30); do
            H=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "http://${ALB}/health" || true)
            R=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "http://${ALB}/ready" || true)
            echo "attempt ${i}: /health=${H} /ready=${R}"
            if [ "$H" = "200" ] && [ "$R" = "200" ]; then
              {
                echo "### Smoke test passed"
                echo ""
                echo "- \`/health\` and \`/ready\` returned HTTP 200 via the ALB (attempt ${i})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Smoke test failed: see docs/TROUBLESHOOTING.md (target health, SSM, journalctl -u ecomm-app)"
          exit 1
