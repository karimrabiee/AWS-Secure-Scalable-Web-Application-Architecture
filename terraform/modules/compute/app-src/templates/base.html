<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1b33">
  <title>{% block title %}Nimbus Store{% endblock %} · Nimbus Store</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container bar">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Nimbus Store home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Nimbus<strong>Store</strong></span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Shop</a>
        <a href="{{ url_for('status_page') }}"{% if request.endpoint == 'status_page' %} aria-current="page"{% endif %}>Platform status</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container foot-in">
      <p>Served by <strong>{{ instance_id }}</strong> in <strong>{{ az }}</strong></p>
      <p class="muted">Protected by AWS WAF · Encrypted RDS · Credentials in AWS Secrets Manager</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
