[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["terraform/modules/compute/app-src", "tests", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["terraform/modules/compute/app-src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
